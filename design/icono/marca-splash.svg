<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 96 96">
  <!-- La marca SOLA, sin el tile: el splash pone su propio fondo verde.
       Mismos paths que ios/AppIcon-1024.svg.

       La matemática del transform, porque es fácil errarle: los paths van de 8
       a 88, o sea una caja de 80. Con translate(t t) scale(s) translate(-8 -8)
       la caja termina ocupando 80*s desde t. Para que la marca sea el 74 % de
       un lienzo de 96 y quede CENTRADA:
         s = (96 * 0.74) / 80 = 0.888
         t = (96 - 96 * 0.74) / 2 = 12.48
       El ícono usa 62 % con s=0.744 y t=18.24 porque ahí el sistema recorta los
       bordes con su máscara; acá no hay máscara, así que la marca puede crecer. -->
  <g transform="translate(12.48 12.48) scale(0.888) translate(-8 -8)">
    <path d="M8 32 A24 24 0 0 1 32 8 H64 A24 24 0 0 1 88 32 V54 L54 88 H32 A24 24 0 0 1 8 64 Z" fill="#F2EFE9"/>
    <path d="M88 54 L54 88 V62 A8 8 0 0 1 62 54 Z" fill="#2F6F55"/>
  </g>
</svg>
